<!doctype html><html><head><link href="https://api.fontshare.com/v2/css?f[]=general-sans@500,600&f[]=cabinet-grotesk@700,800&display=swap" rel="stylesheet">
<style>body{margin:0;padding:36px;font-family:'General Sans';background:#fff;color:#0B2B2A}.row{display:flex;gap:28px;margin-bottom:34px;align-items:center}.lab{width:150px;font-weight:600}.tile{width:110px;height:110px;border-radius:26px;display:grid;place-items:center}.tile svg{width:70px;height:70px}.t1{background:#0F4C4A}.t2{background:#F3F6F4}.small svg{width:22px;height:22px}.word{display:flex;align-items:center;gap:10px;font:600 40px 'General Sans';letter-spacing:-.03em;color:#0F4C4A}.word svg{width:44px;height:44px}</style></head><body>
<div id="r"></div>
<script>
const M={
 'House-pin':(f,g)=>`<path d="M32 59 15.5 41.6A4 4 0 0 1 14.4 38.8V27.4a4 4 0 0 1 1.5-3.1L29.5 13.2a4 4 0 0 1 5 0l13.6 11.1a4 4 0 0 1 1.5 3.1v11.4a4 4 0 0 1-1.1 2.8z" fill="${f}"/><path d="M28.5 41V33.5a3.5 3.5 0 0 1 7 0V41z" fill="${g}"/>`,
 'Open door':(f,g)=>`<path d="M19 50V12a2 2 0 0 1 2-2h22a2 2 0 0 1 2 2v38" fill="none" stroke="${f}" stroke-width="5"/><path d="M24 50V14h16v36z" fill="${g}"/><path d="M24 14l9 3.5v35L24 50z" fill="${f}"/><path d="M24 50h16l9 9H15z" fill="${g}" opacity=".55"/>`,
 'Key-house':(f,g)=>`<path d="M32 8 14 22v18h36V22z" fill="none" stroke="${f}" stroke-width="5.5" stroke-linejoin="round"/><path d="M32 40v18M32 50h7M32 56h5" stroke="${f}" stroke-width="5.5" stroke-linecap="round"/><circle cx="32" cy="27" r="4.5" fill="${g}"/>`,
};
const r=document.getElementById('r');
for(const k in M){const s=(f,g)=>`<svg viewBox="0 0 64 64">${M[k](f,g)}</svg>`;
r.insertAdjacentHTML('beforeend',`<div class="row"><div class="lab">${k}</div><div class="tile t1">${s('#F5F1E8','#E3B95C')}</div><div class="tile t2">${s('#0F4C4A','#D4A84A')}</div><div class="small">${s('#0F4C4A','#D4A84A')}</div><div class="word">${s('#0F4C4A','#D4A84A')}avenor</div></div>`)}
</script></body></html>
